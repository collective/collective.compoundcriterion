[settings]
requirements-in = requirements.txt
main-package = -e .[test]
; setuptools 82+ has no pkg_resources, still used at import time by released add-ons
version-overrides =
    setuptools==81.0.0

[collective.fingerpointing]
url = https://github.com/collective/collective.fingerpointing.git
branch = master

[ftw.labels]
url = https://github.com/imio/ftw.labels.git
branch = python3

[imio.helpers]
url = https://github.com/imio/imio.helpers.git
branch = py3-email-address-headers
